<!-- Firebase SDK (version modulaire 10.x) -->
<script type="module">
  // ───────────────────────────────────────────────────────────────
  //  IMPORTANT : REMPLACE CE BLOC PAR TA CONFIGURATION RÉELLE
  //  → Firebase Console → Project Settings → SDK setup → Config
  // ───────────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
    authDomain: "ton-projet.firebaseapp.com",
    projectId: "ton-projet",
    storageBucket: "ton-projet.appspot.com",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef1234567890abcdef",
    // measurementId: "G-XXXXXXXXXX"   ← optionnel
  };

  // ───────────────────────────────────────────────────────────────
  //  Initialisation Firebase + Auth
  // ───────────────────────────────────────────────────────────────
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  // Décommente selon tes besoins :
  // import { getFirestore } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  // import { getStorage } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  // const db = getFirestore(app);
  // const storage = getStorage(app);

  // Variables globales utilisées dans le reste du code
  window.CU = null;           // Current User
  window.CUdata = null;       // Données Firestore de l'utilisateur
  window.db = null;           // Sera défini si tu utilises Firestore
  window.auth = auth;

  // Gestion du loading + connexion
  onAuthStateChanged(auth, (user) => {
    const loading = document.getElementById("loading");
    const loadMsg = document.getElementById("load-msg");

    if (loading) {
      if (user) {
        loadMsg.textContent = "Connexion réussie... Chargement...";
        window.CU = user;
        console.log("Utilisateur connecté :", user.uid, user.email);

        // → Ici tu pourras charger les données utilisateur depuis Firestore
        // Exemple : getDoc(doc(db, 'users', user.uid)).then(snap => { window.CUdata = snap.data(); ... })
      } else {
        loadMsg.textContent = "Aucun utilisateur connecté";
        console.log("Aucun utilisateur connecté");
      }

      // On masque le loading après 800ms (pour laisser voir le message)
      setTimeout(() => {
        loading.style.display = "none";
        // Affiche la navbar et la page d'accueil par défaut
        document.getElementById("nav").style.display = "flex";
        document.getElementById("home-page").style.display = "block";
      }, 800);
    }
  });

  // Gestion d'erreur globale (optionnel mais très utile)
  window.addEventListener("error", (e) => {
    console.error("Erreur globale :", e.message, e.filename, e.lineno);
    const loadingMsg = document.getElementById("load-msg");
    if (loadingMsg) {
      loadingMsg.textContent = "Erreur de chargement. Vérifie la console.";
      loadingMsg.style.color = "var(--err)";
    }
  });
</script>

<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F2K MARKET – Ebooks, Formations & Produits | F2K MULTISERVICE</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<meta name="theme-color" content="#C9922A">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --g:#C9922A;--gl:#E8B84B;--gs:rgba(201,146,42,.12);
  --dk:#080808;--dk2:#101010;--dk3:#181818;--dk4:#222;--dk5:#2E2E2E;--dk6:#3A3A3A;
  --tx:#EDE9E3;--t2:#B8B0A4;--t3:#7A7268;--t4:#4A4640;
  --ok:#27AE60;--err:#C0392B;--info:#2980B9;--warn:#E67E22;
  --r:8px;--r2:14px;--r3:20px;
  --sh:0 4px 24px rgba(0,0,0,.6);--shg:0 0 0 2px rgba(201,146,42,.4);
}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Sora',sans-serif;background:var(--dk);color:var(--tx);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--dk2);}::-webkit-scrollbar-thumb{background:var(--g);border-radius:2px;}
input,select,textarea,button{font-family:'Sora',sans-serif;}img{max-width:100%;}
.hidden{display:none!important;}
#loading{position:fixed;inset:0;background:var(--dk);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;}
.spin{width:38px;height:38px;border:3px solid var(--dk4);border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.load-logo{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--g);}
.load-logo span{color:var(--tx);}
.load-msg{font-size:.78rem;color:var(--t3);}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:9px 18px;border-radius:25px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;white-space:nowrap;}
.btn-gold{background:var(--g);color:var(--dk);}.btn-gold:hover{background:var(--gl);transform:translateY(-1px);}
.btn-out{background:transparent;border:1.5px solid var(--g);color:var(--g);}.btn-out:hover{background:var(--g);color:var(--dk);}
.btn-ghost{background:var(--dk3);border:1px solid var(--dk5);color:var(--t2);}.btn-ghost:hover{color:var(--tx);}
.btn-ok{background:rgba(39,174,96,.15);border:1px solid rgba(39,174,96,.3);color:var(--ok);}.btn-ok:hover{background:var(--ok);color:#fff;}
.btn-err{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.3);color:var(--err);}.btn-err:hover{background:var(--err);color:#fff;}
.btn-warn{background:rgba(230,126,34,.15);border:1px solid rgba(230,126,34,.3);color:var(--warn);}.btn-warn:hover{background:var(--warn);color:#fff;}
.btn-info{background:rgba(41,128,185,.15);border:1px solid rgba(41,128,185,.3);color:var(--info);}.btn-info:hover{background:var(--info);color:#fff;}
.btn-sm{padding:5px 11px;font-size:.71rem;}.btn-lg{padding:13px 28px;font-size:.95rem;border-radius:35px;}
.btn-block{width:100%;justify-content:center;border-radius:var(--r);}
.btn-wa{background:#25D366;color:#fff;border:none;}.btn-wa:hover{background:#1da851;}
.btn-dl{background:linear-gradient(135deg,#2980B9,#1a5276);color:#fff;border:none;}
.btn-gem{background:linear-gradient(135deg,#4285F4,#34A853);color:#fff;border:none;}
.btn-purple{background:rgba(142,68,173,.2);border:1px solid rgba(142,68,173,.4);color:#af7ac5;}.btn-purple:hover{background:#8e44ad;color:#fff;}
.btn-fb{background:#1877F2;color:#fff;border:none;}.btn-fb:hover{background:#1565c0;}
.btn-tw{background:#1DA1F2;color:#fff;border:none;}.btn-tw:hover{background:#0d8ecf;}
.lang-btn{background:var(--dk3);border:1px solid var(--dk5);color:var(--t2);padding:4px 10px;border-radius:20px;font-size:.72rem;cursor:pointer;font-weight:600;transition:all .2s;}
.lang-btn:hover,.lang-btn.on{background:var(--g);color:var(--dk);border-color:var(--g);}
.fg{margin-bottom:.9rem;}
.fl{display:block;font-size:.74rem;font-weight:600;margin-bottom:.28rem;color:var(--t2);}
.fl em{color:var(--err);font-style:normal;}
.fi,.fsel,.fta{width:100%;padding:10px 13px;border-radius:var(--r);background:var(--dk3);border:1px solid var(--dk5);color:var(--tx);font-size:.84rem;outline:none;transition:all .2s;}
.fi:focus,.fsel:focus,.fta:focus{border-color:var(--g);box-shadow:var(--shg);}
.fta{resize:vertical;min-height:80px;line-height:1.5;}
.fsel option{background:var(--dk3);}
.pw-wrap{position:relative;}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--t3);}
.str-bar{height:3px;border-radius:2px;margin-top:3px;transition:all .3s;width:0;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;}
.al{padding:10px 13px;border-radius:var(--r);margin-bottom:.85rem;font-size:.78rem;line-height:1.6;}
.al-s{background:rgba(39,174,96,.1);border:1px solid rgba(39,174,96,.3);color:var(--ok);}
.al-e{background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.3);color:var(--err);}
.al-i{background:rgba(41,128,185,.1);border:1px solid rgba(41,128,185,.3);color:var(--info);}
.al-w{background:rgba(230,126,34,.1);border:1px solid rgba(230,126,34,.3);color:var(--warn);}
.al-g{background:var(--gs);border:1px solid rgba(201,146,42,.3);color:var(--g);}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.64rem;font-weight:700;text-transform:uppercase;}
.b-ebook{background:#1a4a7a;color:#5dade2;}.b-formation{background:#3d1a6e;color:#af7ac5;}.b-physique{background:#5d2a00;color:#eb984e;}
.b-pending{background:rgba(241,196,15,.15);color:#f1c40f;}.b-approved{background:rgba(39,174,96,.15);color:var(--ok);}
.b-rejected{background:rgba(192,57,43,.15);color:var(--err);}.b-hidden{background:rgba(127,140,141,.15);color:#95a5a6;}
.b-banned{background:rgba(155,89,182,.15);color:#a569bd;}.b-paid{background:rgba(39,174,96,.15);color:var(--ok);}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--dk5),transparent);margin:1.5rem 0;}
.ava{border-radius:50%;object-fit:cover;border:2px solid var(--dk5);}
.ava-up{width:80px;height:80px;border-radius:50%;background:var(--dk3);border:2px dashed var(--dk5);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s;font-size:.68rem;color:var(--t3);gap:3px;}
.ava-up:hover{border-color:var(--g);}
#nav{position:fixed;top:0;width:100%;z-index:800;background:rgba(8,8,8,.97);backdrop-filter:blur(24px);border-bottom:1px solid rgba(201,146,42,.12);height:64px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.logo{font-family:'Playfair Display',serif;font-size:1.55rem;font-weight:900;color:var(--g);letter-spacing:2px;cursor:pointer;flex-shrink:0;}
.logo span{color:var(--tx);}
.nl{display:flex;gap:1.4rem;}
.nl a{color:var(--t2);font-size:.82rem;font-weight:500;cursor:pointer;transition:color .2s;}
.nl a:hover{color:var(--g);}
.nr{display:flex;gap:.5rem;align-items:center;flex-shrink:0;}
.cart-btn{background:var(--dk3);border:1px solid var(--dk5);color:var(--tx);padding:7px 12px;border-radius:25px;cursor:pointer;font-size:.78rem;display:flex;align-items:center;gap:5px;transition:all .2s;}
.cart-btn:hover{border-color:var(--g);}
.cart-n{background:var(--g);color:var(--dk);border-radius:50%;width:16px;height:16px;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.nav-ava{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--g);cursor:pointer;}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:90px 5% 60px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,rgba(201,146,42,.18) 0%,transparent 60%),var(--dk);}
.hpat{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(201,146,42,.018) 0,rgba(201,146,42,.018) 1px,transparent 1px,transparent 90px),repeating-linear-gradient(0deg,rgba(201,146,42,.018) 0,rgba(201,146,42,.018) 1px,transparent 1px,transparent 90px);pointer-events:none;}
.hero-in{position:relative;z-index:1;}
.htag{display:inline-flex;align-items:center;background:var(--gs);border:1px solid rgba(201,146,42,.3);color:var(--g);padding:5px 16px;border-radius:25px;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:1.1rem;}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,9vw,6rem);font-weight:900;line-height:.95;margin-bottom:1rem;background:linear-gradient(160deg,var(--tx) 0%,var(--gl) 40%,var(--g) 60%,var(--tx) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-sub{font-size:.9rem;color:var(--t2);max-width:440px;margin:0 auto 2rem;line-height:1.75;}
.hcta{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;}
.hstats{display:flex;gap:2.5rem;justify-content:center;margin-top:3.5rem;flex-wrap:wrap;}
.hsn{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;color:var(--g);}
.hsl{font-size:.68rem;color:var(--t3);text-transform:uppercase;letter-spacing:1px;}
.cat-sec{padding:55px 5%;background:var(--dk2);}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:.85rem;margin-top:1.6rem;}
.ccard{background:var(--dk3);border:1px solid var(--dk4);border-radius:var(--r2);padding:1.2rem;text-align:center;cursor:pointer;transition:all .3s;}
.ccard:hover{border-color:rgba(201,146,42,.4);transform:translateY(-3px);background:var(--gs);}
.cicon{font-size:2.2rem;margin-bottom:.5rem;}
.cname{font-weight:700;font-size:.85rem;margin-bottom:.2rem;}
.cdesc{font-size:.7rem;color:var(--t3);}
.sec{padding:64px 5%;}.sec.alt{background:var(--dk2);}
.sec-hd{text-align:center;margin-bottom:2rem;}
.sec-tag{color:var(--g);font-size:.68rem;text-transform:uppercase;letter-spacing:3px;font-weight:600;margin-bottom:.3rem;}
.sec-title{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,3.5vw,2.3rem);font-weight:900;}
.sec-sub{color:var(--t2);margin-top:.3rem;font-size:.82rem;}
.fbar{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap;align-items:center;}
.ftab{padding:5px 14px;border-radius:25px;font-size:.74rem;font-weight:500;cursor:pointer;border:1px solid var(--dk5);background:transparent;color:var(--t3);transition:all .2s;}
.ftab.on{background:var(--g);color:var(--dk);border-color:var(--g);font-weight:700;}
.sbox{margin-left:auto;position:relative;}
.sbox input{background:var(--dk3);border:1px solid var(--dk5);color:var(--tx);padding:6px 12px 6px 28px;border-radius:25px;font-size:.76rem;outline:none;width:180px;}
.sbox input:focus{border-color:var(--g);}
.sbox::before{content:'🔍';position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:.68rem;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.1rem;}
.pc{background:var(--dk2);border:1px solid var(--dk4);border-radius:var(--r2);overflow:hidden;transition:all .28s;cursor:pointer;position:relative;}
.pc:hover{transform:translateY(-4px);border-color:rgba(201,146,42,.3);box-shadow:0 14px 36px rgba(0,0,0,.45);}
.pc-img{width:100%;height:180px;background:linear-gradient(135deg,var(--dk3),var(--dk4));display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden;}
.pc-img img{width:100%;height:100%;object-fit:cover;}
.pc-badge{position:absolute;top:8px;left:8px;}
.pc-body{padding:1rem;}
.pc-cat{font-size:.62rem;color:var(--g);text-transform:uppercase;letter-spacing:2px;margin-bottom:.25rem;}
.pc-title{font-weight:600;font-size:.88rem;margin-bottom:.25rem;line-height:1.4;}
.pc-desc{font-size:.74rem;color:var(--t2);line-height:1.5;margin-bottom:.75rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pc-foot{display:flex;align-items:center;justify-content:space-between;}
.pc-price{font-weight:700;font-size:.95rem;color:var(--g);}
.pc-seller{font-size:.64rem;color:var(--t4);margin-bottom:.4rem;display:flex;align-items:center;gap:4px;}
.empty-s{text-align:center;padding:3.5rem;color:var(--t3);}
.ei{font-size:3rem;margin-bottom:.8rem;opacity:.3;}
.wish-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;transition:all .2s;z-index:2;}
.wish-btn:hover{background:rgba(201,146,42,.7);}.wish-btn.on{background:rgba(192,57,43,.8);}
.shop-hero{background:linear-gradient(135deg,var(--dk2),var(--dk3));border:1px solid var(--dk4);border-radius:var(--r3);padding:2rem;margin-bottom:2rem;display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;}
.shop-logo{width:90px;height:90px;border-radius:var(--r2);object-fit:cover;border:2px solid var(--g);background:var(--dk4);display:flex;align-items:center;justify-content:center;font-size:2.5rem;flex-shrink:0;overflow:hidden;}
.shop-name{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--tx);}
.shop-bio{color:var(--t2);font-size:.82rem;margin-top:.3rem;line-height:1.6;}
.ov{display:none;position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:1rem;}
.ov.on{display:flex;}
.modal{background:var(--dk2);border:1px solid var(--dk4);border-radius:var(--r3);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:1.7rem;box-shadow:var(--sh);}
.mxl{max-width:640px;}.msm{max-width:400px;}.mmd{max-width:520px;}
.mhd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.3rem;gap:1rem;}
.mtitle{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;line-height:1.3;}
.mcl{background:none;border:none;color:var(--t3);font-size:1.2rem;cursor:pointer;padding:3px 6px;border-radius:5px;flex-shrink:0;transition:all .2s;}
.mcl:hover{background:var(--dk4);color:var(--tx);}
.msw{text-align:center;margin-top:.85rem;font-size:.77rem;color:var(--t3);}
.msw a{color:var(--g);cursor:pointer;font-weight:500;}
.step-back{display:flex;align-items:center;gap:.4rem;margin-bottom:.9rem;cursor:pointer;color:var(--t3);font-size:.78rem;}
.step-back:hover{color:var(--g);}
.rg3{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem;}
.rtc{background:var(--dk3);border:2px solid var(--dk5);border-radius:var(--r2);padding:.9rem;text-align:center;cursor:pointer;transition:all .2s;}
.rtc:hover{border-color:rgba(201,146,42,.4);}
.rtc.sel{border-color:var(--g);background:var(--gs);}
.rti{font-size:1.8rem;margin-bottom:.3rem;}
.rtn{font-weight:700;font-size:.8rem;margin-bottom:.18rem;}
.rtd{font-size:.66rem;color:var(--t3);line-height:1.4;}
.upz{border:2px dashed var(--dk5);border-radius:var(--r);padding:1rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--dk3);}
.upz:hover{border-color:var(--g);}.upz.done{border-color:var(--ok);border-style:solid;}
.upr{width:100%;height:110px;object-fit:cover;border-radius:6px;margin-top:6px;}
.upz-prog{height:4px;border-radius:2px;background:var(--dk5);margin-top:8px;overflow:hidden;}
.upz-prog-bar{height:100%;background:var(--g);width:0%;transition:width .3s;}
.cart-panel{display:none;position:fixed;right:0;top:0;height:100vh;width:340px;z-index:850;background:var(--dk2);border-left:1px solid var(--dk4);flex-direction:column;padding:1.2rem;box-shadow:-10px 0 40px rgba(0,0,0,.6);}
.cart-panel.on{display:flex;}
.cp-hd{flex-shrink:0;padding-bottom:.85rem;border-bottom:1px solid var(--dk4);margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;}
.cp-items{flex:1;overflow-y:auto;}
.ci{display:flex;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--dk4);}
.ci-img{width:50px;height:50px;border-radius:7px;background:var(--dk3);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;overflow:hidden;}
.ci-img img{width:100%;height:100%;object-fit:cover;}
.ci-nm{font-size:.8rem;font-weight:500;margin-bottom:2px;}
.ci-pr{color:var(--g);font-weight:600;font-size:.78rem;}
.ci-rm{background:none;border:none;color:var(--t3);cursor:pointer;font-size:.9rem;margin-left:auto;}
.ci-rm:hover{color:var(--err);}
.cp-ft{flex-shrink:0;padding-top:.85rem;border-top:1px solid var(--dk4);}
.cp-tot{display:flex;justify-content:space-between;font-size:.9rem;font-weight:700;margin-bottom:.85rem;}
.cp-tot span:last-child{color:var(--g);}
.pay-steps{display:flex;margin-bottom:1.2rem;}
.ps{flex:1;text-align:center;font-size:.7rem;padding:.4rem;border-bottom:2px solid var(--dk5);color:var(--t3);}
.ps.act{border-bottom-color:var(--g);color:var(--g);font-weight:600;}
.ps.done{border-bottom-color:var(--ok);color:var(--ok);}
.fedapay-btn{background:linear-gradient(135deg,#0066CC,#004999);color:#fff;border:none;width:100%;padding:13px;border-radius:var(--r);font-size:.92rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6rem;transition:all .2s;}
.fedapay-btn:hover{opacity:.9;}
.pay-secure{text-align:center;font-size:.68rem;color:var(--t3);margin-top:.5rem;}
.suc-icon{font-size:4rem;margin-bottom:.8rem;}
.suc-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--ok);margin-bottom:.5rem;}
.dl-card{background:var(--dk3);border:1px solid rgba(41,128,185,.3);border-radius:var(--r2);padding:1rem;margin:.6rem 0;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;}
.dl-th{width:46px;height:46px;border-radius:7px;background:var(--dk4);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;overflow:hidden;}
.dl-th img{width:100%;height:100%;object-fit:cover;}
#f2k-chat{position:fixed;bottom:85px;right:22px;z-index:810;width:340px;background:var(--dk2);border:1px solid rgba(66,133,244,.35);border-radius:var(--r3);box-shadow:0 20px 60px rgba(0,0,0,.7);display:none;flex-direction:column;max-height:480px;}
#f2k-chat.on{display:flex;}
.chat-hd{background:linear-gradient(135deg,#1a3a6e,#0d2247);border-radius:var(--r3) var(--r3) 0 0;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;flex-shrink:0;}
.chat-ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4285F4,#34A853);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.chat-name{font-weight:700;font-size:.85rem;}
.chat-status{font-size:.64rem;color:#7fb3f5;}
.chat-msgs{flex:1;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.6rem;}
.msg{max-width:85%;padding:.65rem .85rem;border-radius:var(--r2);font-size:.78rem;line-height:1.55;}
.msg-ai{background:linear-gradient(135deg,rgba(66,133,244,.15),rgba(52,168,83,.1));border:1px solid rgba(66,133,244,.2);border-radius:0 var(--r2) var(--r2) var(--r2);align-self:flex-start;color:var(--tx);}
.msg-user{background:var(--gs);border:1px solid rgba(201,146,42,.25);border-radius:var(--r2) 0 var(--r2) var(--r2);align-self:flex-end;color:var(--tx);}
.msg-typing{display:flex;gap:4px;align-items:center;padding:.5rem .8rem;}
.dot{width:6px;height:6px;border-radius:50%;background:#4285F4;animation:blink 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
